name: Finish admin collaborations integration

on:
  push:
    branches:
      - feat/home-sponsors-carousel-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/home-sponsors-carousel-redesign

      - name: Patch Admin.tsx
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/Admin.tsx')
          s = p.read_text(encoding='utf-8')

          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Missing fragment: {old}')
              s = s.replace(old, new, 1)

          once('  | "social_contents";\n', '  | "active_collaborations"\n  | "social_contents";\n')
          once('  partners: "Sponsor",\n  social_contents: "Social / Video",\n', '  partners: "Sponsor",\n  active_collaborations: "Collab attive",\n  social_contents: "Social / Video",\n')
          once('  partners: "partners",\n  social_contents: "social_contents",\n', '  partners: "partners",\n  active_collaborations: "active_collaborations",\n  social_contents: "social_contents",\n')
          once('  partners: "id",\n  social_contents: "id",\n', '  partners: "id",\n  active_collaborations: "id",\n  social_contents: "id",\n')
          once('  partners: ["name", "tier", "logo_url", "website_url", "sort_order"],\n  social_contents: [', '  partners: ["name", "tier", "logo_url", "website_url", "sort_order"],\n  active_collaborations: ["flyer_url", "sort_order"],\n  social_contents: [')
          once('  starter: "Titolare",\n};', '  flyer_url: "Volantino",\n  starter: "Titolare",\n};')
          once('  partners: ["name", "tier"],\n  social_contents: ["platform", "title", "content_url"],', '  partners: ["name", "tier"],\n  active_collaborations: ["flyer_url"],\n  social_contents: ["platform", "title", "content_url"],')
          once('      const folder = field.includes("logo")\n', '      const folder = field.includes("flyer")\n        ? "collaborations"\n        : field.includes("logo")\n')
          once('      field.includes("thumbnail");\n', '      field.includes("thumbnail") ||\n      field === "flyer_url";\n')
          once('            "partners",\n            "social_contents",\n', '            "partners",\n            "active_collaborations",\n            "social_contents",\n')

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/integrate-admin-collab-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx .github/workflows/integrate-admin-collab-final.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add active collaborations to admin sidebar"
          git push origin HEAD:feat/home-sponsors-carousel-redesign
